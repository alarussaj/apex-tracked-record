name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

# Cancel superseded runs on the same PR
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

  prettier:
    name: Prettier Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check

  static-analysis:
    name: PMD Static Analysis
    runs-on: ubuntu-latest
    # Runs for all PRs (including dependabot) — PMD needs no secrets.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PMD
        uses: pmd/pmd-github-action@v2
        with:
          version: '7.7.0'
          sourcePath: 'force-app'
          rulesets: 'pmd-ruleset.xml'
          analyzeModifiedFilesOnly: false

  validate:
    name: Deploy & Test on Scratch Org
    runs-on: ubuntu-latest
    # Skip for dependabot — it doesn't have access to secrets
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli@latest
          sf --version

      - name: Authenticate Dev Hub
        env:
          SF_DEVHUB_AUTH_URL: ${{ secrets.SF_DEVHUB_AUTH_URL }}
        shell: bash
        run: |
          set -e
          if [ -z "$SF_DEVHUB_AUTH_URL" ]; then
            echo "::error::SF_DEVHUB_AUTH_URL secret is not set. See CONTRIBUTING.md for setup."
            exit 1
          fi
          printf '%s' "$SF_DEVHUB_AUTH_URL" > /tmp/devhub-auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/devhub-auth.txt --alias DevHub --set-default-dev-hub
          rm -f /tmp/devhub-auth.txt

      - name: Create scratch org
        run: |
          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --alias ciScratch \
            --duration-days 1 \
            --set-default \
            --wait 10

      - name: Deploy source
        run: sf project deploy start --source-dir force-app --target-org ciScratch

      - name: Run Apex tests
        run: |
          sf apex run test \
            --target-org ciScratch \
            --code-coverage \
            --result-format human \
            --wait 20 \
            --test-level RunLocalTests

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ciScratch --no-prompt || true
