name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create unlocked package version & GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli@latest
          sf --version

      - name: Authenticate Dev Hub (JWT)
        shell: bash
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
          SF_HUB_USERNAME: ${{ secrets.SF_HUB_USERNAME }}
        run: |
          set -e
          if [ -z "$SF_JWT_KEY" ] || [ -z "$SF_CONSUMER_KEY" ] || [ -z "$SF_HUB_USERNAME" ]; then
            echo "::error::JWT secrets missing. Need SF_JWT_KEY, SF_CONSUMER_KEY, SF_HUB_USERNAME. See JWT-SETUP.md."
            exit 1
          fi
          echo "$SF_JWT_KEY" > /tmp/server.key
          sf org login jwt \
            --client-id "$SF_CONSUMER_KEY" \
            --jwt-key-file /tmp/server.key \
            --username "$SF_HUB_USERNAME" \
            --set-default-dev-hub \
            --alias DevHub
          rm -f /tmp/server.key

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Create package version
        id: package
        run: |
          set -eo pipefail
          echo "::group::Running sf package version create"
          if sf package version create \
            --package "apex-access-utils" \
            --installation-key-bypass \
            --wait 30 \
            --code-coverage \
            --target-dev-hub DevHub \
            --json > /tmp/sf-stdout.json 2> /tmp/sf-stderr.log; then
            SF_EXIT_CODE=0
          else
            SF_EXIT_CODE=$?
          fi
          echo "::endgroup::"

          echo "::group::sf stdout"
          cat /tmp/sf-stdout.json
          echo "::endgroup::"

          if [ -s /tmp/sf-stderr.log ]; then
            echo "::group::sf stderr"
            cat /tmp/sf-stderr.log
            echo "::endgroup::"
          fi

          if [ "$SF_EXIT_CODE" -ne 0 ]; then
            echo "::error::sf package version create exited with code $SF_EXIT_CODE"
            exit "$SF_EXIT_CODE"
          fi

          if PACKAGE_VERSION_ID=$(jq -r '.result.SubscriberPackageVersionId // empty' /tmp/sf-stdout.json 2>/tmp/jq-stderr.log); then
            if [ -z "$PACKAGE_VERSION_ID" ]; then
              echo "::error::sf succeeded but no SubscriberPackageVersionId in output"
              exit 1
            fi
          else
            echo "::error::Failed to parse sf output as JSON. jq stderr:"
            cat /tmp/jq-stderr.log
            exit 1
          fi

          echo "package_version_id=$PACKAGE_VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "::notice::Package Version Id: $PACKAGE_VERSION_ID"

      - name: Promote package version
        run: |
          sf package version promote \
            --package "${{ steps.package.outputs.package_version_id }}" \
            --target-dev-hub DevHub \
            --no-prompt

      - name: Delete existing release for tag (prevents draft collision)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag=false 2>/dev/null || true

      - name: Generate release notes
        id: release_notes
        uses: release-drafter/release-drafter@v6
        with:
          version: ${{ steps.version.outputs.version }}
          tag: ${{ github.ref_name }}
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ${{ steps.release_notes.outputs.body }}

            ---

            ### Install URL

            **Production / Developer Edition:**
            ```
            https://login.salesforce.com/packaging/installPackage.apexp?p0=${{ steps.package.outputs.package_version_id }}
            ```

            **Sandbox:**
            ```
            https://test.salesforce.com/packaging/installPackage.apexp?p0=${{ steps.package.outputs.package_version_id }}
            ```

            ### SFDX Install

            ```bash
            sf package install --package ${{ steps.package.outputs.package_version_id }} --target-org <your-org-alias> --wait 10
            ```
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
